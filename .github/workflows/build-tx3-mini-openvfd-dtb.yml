name: Build TX3 Mini OpenVFD DTB

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel label for artifact"
        required: true
        default: "6.18.48"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: tx3-mini-openvfd-${{ inputs.kernel_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      KERNEL_VERSION: ${{ inputs.kernel_version }}
      DTB_NAME: meson-gxl-s905w-tx3-mini.dtb
      REPO_DTB: build-armbian/armbian-files/platform-files/amlogic/bootfs/dtb/amlogic/meson-gxl-s905w-tx3-mini.dtb
      OPENVFD_CONF: build-armbian/armbian-files/platform-files/amlogic/rootfs/usr/share/openvfd/conf/tx3-mini.conf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install device-tree tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler
          command -v dtc
          command -v fdtoverlay

      - name: Verify base DTB from repository
        run: |
          set -euxo pipefail
          test -f "$REPO_DTB"
          echo "Base DTB:"
          ls -l "$REPO_DTB"
          sha256sum "$REPO_DTB"

          # Ensure the repository DTB is valid before touching it.
          dtc -I dtb -O dts "$REPO_DTB" -o /tmp/base.dts
          grep -F 'model = "Oranth Tanix TX3 Mini";' /tmp/base.dts || true

      - name: Build OpenVFD overlay
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/pkg"

          cat > "$RUNNER_TEMP/work/openvfd-overlay.dts" <<'DTS'
          /dts-v1/;
          /plugin/;

          / {
              compatible = "amlogic,meson-gxl";

              fragment@0 {
                  target-path = "/";

                  __overlay__ {
                      openvfd {
                          compatible = "open,vfd";
                          dev_name = "openvfd";
                          status = "okay";
                      };
                  };
              };
          };
          DTS

          dtc -@ -I dts -O dtb             -o "$RUNNER_TEMP/work/openvfd-overlay.dtbo"             "$RUNNER_TEMP/work/openvfd-overlay.dts"

      - name: Apply overlay to TX3 Mini DTB
        run: |
          set -euxo pipefail

          fdtoverlay             -i "$REPO_DTB"             -o "$RUNNER_TEMP/pkg/$DTB_NAME"             "$RUNNER_TEMP/work/openvfd-overlay.dtbo"

          echo "Patched DTB:"
          ls -l "$RUNNER_TEMP/pkg/$DTB_NAME"
          sha256sum "$RUNNER_TEMP/pkg/$DTB_NAME"

      - name: Verify patched DTB
        run: |
          set -euxo pipefail

          dtc -I dtb -O dts             "$RUNNER_TEMP/pkg/$DTB_NAME"             -o "$RUNNER_TEMP/pkg/tx3-mini-openvfd.dts"

          grep -A6 -B2 -F 'compatible = "open,vfd";'             "$RUNNER_TEMP/pkg/tx3-mini-openvfd.dts"

          # Verify that the important base identity is still present too.
          grep -F 'model = "Oranth Tanix TX3 Mini";'             "$RUNNER_TEMP/pkg/tx3-mini-openvfd.dts" || true

          cp "$RUNNER_TEMP/work/openvfd-overlay.dts"             "$RUNNER_TEMP/pkg/openvfd-overlay.dts"
          cp "$RUNNER_TEMP/work/openvfd-overlay.dtbo"             "$RUNNER_TEMP/pkg/openvfd-overlay.dtbo"

          if [ -f "$OPENVFD_CONF" ]; then
            cp "$OPENVFD_CONF" "$RUNNER_TEMP/pkg/tx3-mini.conf"
          fi

      - name: Create safe installer and rollback
        run: |
          set -euxo pipefail

          cat > "$RUNNER_TEMP/pkg/install-dtb.sh" <<'INSTALL'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          TARGET="/boot/dtb/amlogic/meson-gxl-s905w-tx3-mini.dtb"
          SRC="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)/meson-gxl-s905w-tx3-mini.dtb"
          BACKUP="${TARGET}.pre-openvfd"

          [[ $EUID -eq 0 ]] || { echo "Run as root: sudo ./install-dtb.sh"; exit 1; }
          [[ -f "$SRC" ]] || { echo "Missing patched DTB: $SRC"; exit 1; }
          [[ -f "$TARGET" ]] || { echo "Current DTB not found: $TARGET"; exit 1; }

          echo "Current DTB:"
          ls -l "$TARGET"
          sha256sum "$TARGET"

          echo "New DTB:"
          ls -l "$SRC"
          sha256sum "$SRC"

          if [[ ! -f "$BACKUP" ]]; then
              cp -a "$TARGET" "$BACKUP"
              echo "Backup created: $BACKUP"
          else
              echo "Backup already exists: $BACKUP"
          fi

          install -m 0644 "$SRC" "$TARGET"
          sync

          echo
          echo "Patched DTB installed."
          echo "Reboot with: sudo reboot"
          echo "Rollback with: sudo ./restore-dtb.sh"
          INSTALL

          cat > "$RUNNER_TEMP/pkg/restore-dtb.sh" <<'RESTORE'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          TARGET="/boot/dtb/amlogic/meson-gxl-s905w-tx3-mini.dtb"
          BACKUP="${TARGET}.pre-openvfd"

          [[ $EUID -eq 0 ]] || { echo "Run as root: sudo ./restore-dtb.sh"; exit 1; }
          [[ -f "$BACKUP" ]] || { echo "Backup not found: $BACKUP"; exit 1; }

          cp -a "$BACKUP" "$TARGET"
          sync
          echo "Original DTB restored. Reboot with: sudo reboot"
          RESTORE

          chmod +x "$RUNNER_TEMP/pkg/install-dtb.sh"                    "$RUNNER_TEMP/pkg/restore-dtb.sh"

          cat > "$RUNNER_TEMP/pkg/README.txt" <<EOF
          TX3 Mini OpenVFD DTB
          ====================

          Base DTB:
            $REPO_DTB

          Artifact label:
            ${KERNEL_VERSION}

          This workflow does not edit the decompiled DTS by string manipulation.
          It builds a small Device Tree overlay and applies it to the repository
          DTB with fdtoverlay.

          Install:
            chmod +x install-dtb.sh restore-dtb.sh
            sudo ./install-dtb.sh
            sudo reboot

          Rollback:
            sudo ./restore-dtb.sh
            sudo reboot
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tx3-mini-openvfd-dtb-${{ inputs.kernel_version }}
          path: ${{ runner.temp }}/pkg/
          if-no-files-found: error
          retention-days: 30
